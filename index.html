<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <div class="title">Snake Game</div>
            <div class="score-board">
                <div class="score-item">
                    Score
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-item">
                    Best
                    <span class="score-value best-value" id="bestScore">0</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <div class="key-hint" id="hintUp">↑ <span>W</span></div>
            <div class="key-hint" id="hintDown">↓ <span>S</span></div>
            <div class="key-hint" id="hintLeft">← <span>A</span></div>
            <div class="key-hint" id="hintRight">→ <span>D</span></div>
            <button class="restart-btn" id="restartBtn">Restart</button>
        </div>

        <div class="game-over-overlay" id="gameOverOverlay">Game Over</div>
    </div>

    <script src="game.js"></script>
</body>
</html>
